# One @types/node for the whole tree, matching the Node 24 the Dockerfile and
# CI run. Transitive dependencies pulled in 22.x and 26.x side by side, and
# the mismatched EventEmitter types broke `pnpm typecheck` on every
# `ChildProcess.on(...)` in server/lib.
overrides:
  '@types/node': 24.13.3

# better-sqlite3 is denied its build on purpose: v13 loads the prebuilt binary
# it ships for every platform (`lib/binding.js`), and running its node-gyp
# build puts a C++ toolchain and Python on the critical path — which the
# Dockerfile's build stage deliberately doesn't have (see its comment).
allowBuilds:
  better-sqlite3: false
  esbuild: true
  onnxruntime-node: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
