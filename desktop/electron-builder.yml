# What ships. `scripts/prepack.ts` stages `staging/` first; everything in it
# goes in as extraResources, outside the asar, because every one of those paths
# is either spawned as a process or read by one.
appId: dev.akapela.desktop
productName: Akapela
copyright: Akapela contributors, GPL-3.0-only
directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

extraResources:
  - from: staging/output
    to: output
  - from: staging/migrations
    to: migrations
  - from: staging/separators
    to: separators
  - from: staging/stretch
    to: stretch
  - from: staging/bin
    to: bin
  - from: staging/licenses
    to: licenses
  # Read by the shell rather than by a child process: only Linux has to hand
  # its window an icon file (`src/icon.ts`).
  - from: staging/icon.png
    to: icon.png

# What an installed app updates itself from on Windows and Linux: this is
# what makes electron-builder write latest.yml / latest-linux.yml and the
# blockmaps, and app-update.yml into the packaged resources, which is where
# electron-updater reads the repository from (ADR 0009's amendment on
# Updates). The release workflow fails if that metadata is missing. macOS
# gets none of it: Squirrel.Mac refuses to update an unsigned app, so that
# platform links to the download page instead.
publish:
  - provider: github
    owner: kawishbit
    repo: akapela
    releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned initially. SmartScreen warns and can be clicked through — a real
  # but survivable cost next to a few hundred dollars a year for an OV
  # certificate on a first release nobody has installed yet. Revisit if people
  # actually hit it.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: ../LICENSE

mac:
  category: public.app-category.music
  # The one platform that does not get the full-bleed square `resources/icon.png`
  # gives Windows and Linux. macOS 26 masks app icons to a squircle itself and
  # clips what falls outside it, while macOS 15 and earlier mask nothing and
  # would render that square as a hard tile among rounded neighbours. This one
  # has its corners already rounded, which both versions read correctly.
  #
  # It is deliberately *not* inset. The widely-cited "824x824 body on a 1024
  # canvas" is not Apple guidance — it is reverse-engineered from Apple's
  # retired flat-icon templates — and under 26's mask an inset icon renders
  # visibly smaller than every peer in the Dock. Icon Composer is the real
  # answer on 26 and is tracked in `.scratch/mac-signing/`; both files come
  # from `pnpm icons:generate` at the repo root (`scripts/icon-shapes.ts`).
  #
  # Named relative to `buildResources` above, which is where electron-builder
  # looks first — the same lookup that finds `icon.png` for the other two
  # platforms without any key at all.
  icon: icon-mac.png
  target:
    # Apple Silicon only; there is no Intel build. Its ffmpeg is the pinned
    # static arm64 build in scripts/binaries.json.
    - target: dmg
      arch: [arm64]
  # Kept even though the build below is unsigned: if a certificate is ever
  # added, the hardened runtime is where the microphone dies silently without
  # these — this usage description and the audio-input entitlement are what
  # keep getUserMedia from failing at the exact moment someone presses record,
  # with no build-time error anywhere.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Akapela records your singing over a backing track.
  # No Apple Developer Program membership ($99/year) behind this build, so no
  # signing and no notarization: `notarize: true` fails outright without Apple
  # credentials — it errors asking for them rather than skipping quietly — and
  # a signing identity that isn't there isn't found either, so electron-builder
  # just ships the .app/.dmg unsigned. The cost lands on whoever opens it
  # rather than on the build. An unsigned Apple Silicon app downloaded from the
  # internet is refused as "damaged" rather than "from an unidentified
  # developer", and right-click → Open does not get past that. The README tells
  # a Mac user to clear the quarantine flag
  # (`xattr -dr com.apple.quarantine /Applications/Akapela.app`). That is
  # documented, not solved, until there is an Apple Developer account.
  notarize: false

dmg:
  writeUpdateInfo: false

linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64]

# Left unset, mksquashfs compresses with gzip in separate 128KB blocks, so
# nothing is shared between blocks or files. That is most of why the Linux
# download came out bigger than the NSIS installer, whose app archive is one
# LZMA 7z. xz with 1MB blocks cuts the AppImage by roughly a fifth, at the
# cost of a somewhat slower launch: an AppImage decompresses what it reads
# every time it runs. This is set here and
# not as the root `compression: maximum`, which would also change the DMG's
# format and the NSIS settings.
appImage:
  compression: xz
