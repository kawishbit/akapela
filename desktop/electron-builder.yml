# What ships. `scripts/prepack.ts` stages `staging/` first; everything in it
# goes in as extraResources, outside the asar, because every one of those paths
# is either spawned as a process or read by one.
appId: dev.akapela.desktop
productName: Akapela
copyright: Akapela contributors, GPL-3.0-only
directories:
  output: release
  buildResources: resources

files:
  - dist/**/*
  - package.json

extraResources:
  - from: staging/output
    to: output
  - from: staging/migrations
    to: migrations
  - from: staging/separators
    to: separators
  - from: staging/stretch
    to: stretch
  - from: staging/bin
    to: bin
  - from: staging/licenses
    to: licenses

# No auto-updater in v1: the app checks the latest release and links to it.
# electron-builder writes these anyway; nothing reads them.
publish:
  - provider: github
    owner: kawishbit
    repo: akapela
    releaseType: release

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned initially. SmartScreen warns and can be clicked through — a real
  # but survivable cost next to a few hundred dollars a year for an OV
  # certificate on a first release nobody has installed yet. Revisit if people
  # actually hit it.
  signAndEditExecutable: true

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: ../LICENSE

mac:
  category: public.app-category.music
  target:
    # Apple Silicon only; there is no Intel build. Its ffmpeg is the pinned
    # static arm64 build in scripts/binaries.json.
    - target: dmg
      arch: [arm64]
  # Kept even though the build below is unsigned: if a certificate is ever
  # added, the hardened runtime is where the microphone dies silently without
  # these — this usage description and the audio-input entitlement are what
  # keep getUserMedia from failing at the exact moment someone presses record,
  # with no build-time error anywhere.
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Akapela records your singing over a backing track.
  # No Apple Developer Program membership ($99/year) behind this build, so no
  # signing and no notarization: `notarize: true` fails outright without Apple
  # credentials — it errors asking for them rather than skipping quietly — and
  # a signing identity that isn't there isn't found either, so electron-builder
  # just ships the .app/.dmg unsigned. The cost lands on whoever opens it
  # rather than on the build. An unsigned Apple Silicon app downloaded from the
  # internet is refused as "damaged" rather than "from an unidentified
  # developer", and right-click → Open does not get past that. The README tells
  # a Mac user to clear the quarantine flag
  # (`xattr -dr com.apple.quarantine /Applications/Akapela.app`). That is
  # documented, not solved, until there is an Apple Developer account.
  notarize: false

dmg:
  writeUpdateInfo: false

linux:
  category: AudioVideo
  target:
    - target: AppImage
      arch: [x64]
