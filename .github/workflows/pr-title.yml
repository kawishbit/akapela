# Turns a PR's title into the semver-bump label the release workflow reads
# (ADR 0011): title the PR like a Conventional Commit and the label follows,
# rather than having to remember to click one by hand.
name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            build
            ci
          requireScope: false

      - name: Apply the matching bump label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -e
          # Conventional Commits marks a breaking change with `!` right after
          # the type/scope (`feat!:`, `fix(api)!:`) — not a type of its own.
          # A `BREAKING CHANGE:` footer is real Conventional Commits too, but
          # invisible to a title-only check; it isn't detected here.
          case "$TITLE" in
            *'!:'*) BUMP=major ;;
            feat:*|feat\(*) BUMP=minor ;;
            *) BUMP=patch ;;
          esac
          # --repo is required on every call: there is no checkout in this
          # job, so gh has no local git remote to infer the repository from.
          # Idempotent: creating a label that already exists just updates it,
          # so this never fails on a repeat run.
          gh label create "bump:$BUMP" --repo "$REPO" --color 5319e7 --force
          gh pr edit "$PR" --repo "$REPO" \
            --remove-label "bump:major" \
            --remove-label "bump:minor" \
            --remove-label "bump:patch" \
            2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label "bump:$BUMP"
