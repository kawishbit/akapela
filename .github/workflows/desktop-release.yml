# Cuts a release, builds the desktop installers, and publishes them to a
# GitHub Release with checksums (ADR 0011 and its amendments).
#
#   1. `workflow_dispatch`, by hand: `version` computes the next semver (or
#      takes the input's override), commits it into both `package.json`
#      files on `release/vX.Y.Z`, and opens a PR to `main`. `main` only takes
#      changes through a PR, so this stops there.
#   2. Merging that PR (by hand) lands the bump. That merge event runs `tag`,
#      then `build`, then `publish`, all in the same workflow run. They can't
#      wait on the tag push instead: a push made with GITHUB_TOKEN never
#      triggers another workflow run.
#
# `dry_run` on the dispatch skips all of that and just runs `build` across
# the matrix from whatever ref was dispatched — nothing is versioned, tagged,
# or published. Use it to prove the installers still build before cutting a
# release, since a broken leg otherwise only shows up mid-release.
#
# `push: tags` remains for a tag pushed by a person with their own
# credentials, which does trigger normally: `build` and `publish` run on it.
#
# `build` is a matrix rather than something run from a development machine
# because a macOS DMG has to be built on a macOS runner.
name: Desktop release

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Leave blank to auto-bump from the PRs merged since the previous tag
          (bump:major/minor/patch labels, highest wins, defaults to patch).
          Or give "major"/"minor"/"patch" to force that bump, or an explicit
          "X.Y.Z" to override the computed version entirely. Opens a release
          PR to main — merge it to actually cut the release.
        required: false
      dry_run:
        description: Only build the installers from this ref. No version bump, tag, or release.
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ inputs.version }}
        run: |
          set -eo pipefail

          # The tag is what "since the previous release" means, below — but
          # the version to bump *from* has to be at least package.json's
          # current value too. A release PR can merge (advancing package.json)
          # without the release ever finishing, and the tag alone would then
          # propose a version already spent.
          prev_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          tag_version=${prev_tag#v}
          [ -z "$tag_version" ] && tag_version="0.0.0"
          pkg_version=$(node -p "require('./package.json').version")
          prev_version=$(printf '%s\n%s\n' "$tag_version" "$pkg_version" | sort -V | tail -n1)

          new_version=""
          bump=""
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            new_version="$INPUT"
          elif [[ "$INPUT" == "major" || "$INPUT" == "minor" || "$INPUT" == "patch" ]]; then
            bump="$INPUT"
          elif [ -n "$INPUT" ]; then
            echo "::error::version input '$INPUT' is neither X.Y.Z nor major/minor/patch" >&2
            exit 1
          else
            # Auto: the highest-precedence bump:* label on any PR merged since
            # the previous tag, defaulting to patch.
            if [ -n "$prev_tag" ]; then
              since=$(git log -1 --format=%aI "$prev_tag")
            else
              since="1970-01-01T00:00:00Z"
            fi
            labels=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
              --search "merged:>$since" --json labels --limit 200 \
              --jq '[.[].labels[].name] | join(",")')
            if echo "$labels" | grep -q "bump:major"; then bump="major"
            elif echo "$labels" | grep -q "bump:minor"; then bump="minor"
            else bump="patch"
            fi
          fi

          if [ -z "$new_version" ]; then
            IFS='.' read -r major minor patch <<< "$prev_version"
            case "$bump" in
              major) new_version="$((major + 1)).0.0" ;;
              minor) new_version="$major.$((minor + 1)).0" ;;
              patch) new_version="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          # An explicit X.Y.Z override is the one way to land at or below
          # what already exists; refuse it here rather than fail later with
          # "nothing to commit" or a tag collision.
          if [ "$new_version" = "$prev_version" ] \
            || [ "$(printf '%s\n%s\n' "$new_version" "$prev_version" | sort -V | tail -n1)" != "$new_version" ]; then
            echo "::error::v$new_version is not newer than v$prev_version (latest tag v$tag_version, package.json $pkg_version)" >&2
            exit 1
          fi

          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Bump both package.json files and open a release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          BASE: ${{ github.ref_name }}
        run: |
          set -eo pipefail
          branch="release/$TAG"
          git checkout -b "$branch"
          npm pkg set version="$VERSION"
          (cd desktop && npm pkg set version="$VERSION")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json desktop/package.json
          git commit -m "chore(release): $TAG"
          # release/* branches belong to this job. One left over from an
          # earlier attempt at the same version (a release PR closed without
          # merging, or a run that failed after pushing) is replaced rather
          # than merged with. Only main/master/dev/prod are rule-protected.
          git push --force origin "$branch"
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$open_pr" ]; then
            echo "Release PR #$open_pr was already open for $branch; its branch is now updated."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE" --head "$branch" \
              --title "chore(release): $TAG" \
              --body "Merging this cuts $TAG: tag, build, and publish run on the merge itself."
          fi

  # Only on a merged release/v* PR. Tags the exact merge commit, not whatever
  # main has moved on to by the time this runs.
  tag:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Tag the merge commit and push it
        id: tag
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eo pipefail
          tag="${BRANCH#release/}"
          sha=$(git rev-parse HEAD)
          existing=$(git ls-remote origin "refs/tags/$tag" | cut -f1)
          if [ -z "$existing" ]; then
            git tag "$tag"
            git push origin "refs/tags/$tag"
          elif [ "$existing" != "$sha" ]; then
            echo "::error::$tag already exists at $existing, not this merge commit $sha" >&2
            exit 1
          else
            echo "$tag already points at $sha; building and publishing it again."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Lint, typecheck, and the test suite, once, before any installer is built.
  # The tests are platform-independent but shell out to a real ffmpeg for
  # their audio fixtures and the Mix render, which the runner image doesn't
  # carry. Any stock ffmpeg with libmp3lame will do: the render stretches with
  # Rubber Band WebAssembly, not ffmpeg's rubberband filter (ADR 0003).
  checks:
    needs: tag
    # always() so a skipped `tag` (every path except a merged release PR)
    # doesn't skip this through the usual needs propagation; the conditions
    # below decide instead.
    if: >-
      always() && !cancelled() && (
        github.event_name == 'push'
        || needs.tag.result == 'success'
        || (github.event_name == 'workflow_dispatch' && inputs.dry_run)
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.tag.outputs.sha || github.sha }}

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  build:
    needs: [tag, checks]
    if: always() && !cancelled() && needs.checks.result == 'success'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          # Apple Silicon only — there is no Intel macOS build. macos-latest
          # runners are arm64, and this leg's ffmpeg is a pinned static arm64
          # build like the other two platforms' (desktop/scripts/binaries.json).
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tagged merge commit on a release merge; otherwise the commit
          # the event itself points at (the tag on a tag push, the dispatched
          # ref's head on a dry run).
          ref: ${{ needs.tag.outputs.sha || github.sha }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The app itself, exactly as it is built for the container. The desktop
      # shell wraps this; it does not replace any of it (ADR 0009). Installed
      # per platform, since better-sqlite3 and onnxruntime-node are native.
      - name: Build the app
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install the desktop shell
        working-directory: desktop
        # `desktop/` is installed from inside its own directory — there is no
        # pnpm workspace in this repo, and the root install (the one the
        # Dockerfile runs) must never see Electron.
        run: pnpm install --frozen-lockfile

      - name: Fetch the pinned ffmpeg
        working-directory: desktop
        run: pnpm fetch-binaries -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      # Checked here as well as when it was pinned. The macOS build comes from a
      # different publisher than the other two, so the arm64-only, macOS-only
      # libraries, and MP3 encoder claims in binaries.json are asserted on a
      # real Mac rather than trusted.
      - name: Check the macOS ffmpeg
        if: matrix.platform == 'darwin'
        working-directory: desktop/vendor/darwin-arm64
        run: |
          set -eo pipefail
          archs=$(lipo -archs ffmpeg)
          [ "$archs" = "arm64" ] || { echo "::error::ffmpeg is built for '$archs', not arm64 only" >&2; exit 1; }
          outside=$(otool -L ffmpeg | tail -n +2 | awk '{print $1}' | grep -vE '^(/usr/lib/|/System/Library/)' || true)
          [ -z "$outside" ] || { echo "::error::ffmpeg loads libraries outside macOS itself: $outside" >&2; exit 1; }
          # Not `grep -q`: it exits at the first match, ffmpeg dies of SIGPIPE,
          # and pipefail fails the step on a build that is fine.
          ./ffmpeg -hide_banner -encoders | grep libmp3lame >/dev/null \
            || { echo "::error::this ffmpeg has no libmp3lame encoder; the MP3 export needs it" >&2; exit 1; }

      - name: Build the installer
        working-directory: desktop
        env:
          AKAPELA_TARGET_PLATFORM: ${{ matrix.platform }}
          AKAPELA_TARGET_ARCH: ${{ matrix.arch }}
          # Neither platform is signed yet (no Apple Developer account, no
          # Windows certificate). The credentials are passed through so
          # signing starts working the day the secrets exist.
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # An env var set to '' is still set. electron-builder on macOS reads
          # an empty CSC_LINK as a certificate path, resolves it to the working
          # directory, and fails with "desktop not a file" — so a missing
          # secret has to become an unset variable, not an empty one.
          for var in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!var}" ] || unset "$var"
          done
          if [ -z "${CSC_LINK:-}" ]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          pnpm pack:app -- --${{ matrix.arch }}

      - name: Checksum the artifacts
        working-directory: desktop/release
        shell: bash
        run: |
          shopt -s nullglob
          # macOS runners have `shasum`, not `sha256sum`.
          sha256() { command -v sha256sum >/dev/null && sha256sum "$1" || shasum -a 256 "$1"; }
          files=(*.exe *.dmg *.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::electron-builder produced no installer in desktop/release" >&2
            ls -la
            exit 1
          fi
          for file in "${files[@]}"; do
            sha256 "$file" > "$file.sha256"
          done

      # An installed app updates itself from this metadata (ADR 0009's
      # amendment on Updates). A Release carrying installers but no metadata
      # looks perfectly fine and only fails months later, on someone else's
      # machine, so a missing file fails the build here instead.
      - name: Check the update metadata
        working-directory: desktop/release
        shell: bash
        run: |
          set -eo pipefail
          missing=()
          case "${{ matrix.platform }}" in
            win32)
              [ -f latest.yml ] || missing+=(latest.yml)
              compgen -G "*.exe.blockmap" >/dev/null || missing+=("*.exe.blockmap")
              ;;
            linux)
              [ -f latest-linux.yml ] || missing+=(latest-linux.yml)
              ;;
            darwin)
              # macOS cannot install an Update in place while the build is
              # unsigned, so a Release must not carry metadata promising it can.
              rm -f latest-mac.yml
              ;;
          esac
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::electron-builder produced no ${missing[*]} in desktop/release; an installed app could not update from this Release" >&2
            ls -la
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: akapela-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.sha256
            desktop/release/latest*.yml
            desktop/release/*.blockmap

  publish:
    needs: [tag, build]
    if: always() && needs.build.result == 'success' && github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # A plain tag push carries its tag in github.ref_name; a release
          # merge doesn't, only what `tag` pushed.
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}
          files: artifacts/*
          generate_release_notes: true
