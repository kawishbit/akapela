# Cuts a release, then builds the desktop installers on the tag it creates and
# publishes them to a GitHub Release with checksums.
#
# Three steps (ADR 0011, amended twice — see the ADR for both):
#   1. `workflow_dispatch`, by hand: the `version` job computes the next
#      semver (or takes the input's override), commits it into both
#      `package.json` files on a new `release/vX.Y.Z` branch, and opens a PR
#      to `main`. It does not merge it — `main` requires every change go
#      through a PR, same as any other change to it.
#   2. Merging that PR (by hand) is what actually lands the version bump.
#   3. The `tag` job, on that PR's merge, tags the resulting commit and
#      pushes it. That push does *not* retrigger this workflow — a push made
#      with the default GITHUB_TOKEN never does, a deliberate GitHub Actions
#      anti-recursion guard, found out by a real `v1.0.1` tag that got
#      pushed and then never built. So `build` and `publish` are chained
#      directly off the same merged-PR run instead of waiting on a tag push
#      that was never going to arrive; `push: tags` stays as a fallback for
#      a tag pushed by an actual human with their own credentials, which
#      *does* trigger normally.
#
# `build` is a matrix rather than something run from a development machine
# because a macOS DMG has to be built and notarized on a macOS runner — that
# is the forcing function, not a preference.
name: Desktop release

on:
  push:
    tags: ['v*']
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Leave blank to auto-bump from the PRs merged since the previous tag
          (bump:major/minor/patch labels, highest wins, defaults to patch).
          Or give "major"/"minor"/"patch" to force that bump, or an explicit
          "X.Y.Z" to override the computed version entirely. Opens a PR to
          main rather than tagging directly — merge it to actually cut the
          release (see the `tag` job).
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  # Only what workflow_dispatch triggers: compute/accept the version, commit
  # it to a release branch, and open a PR. Never runs on the other two
  # triggers — a tag push means this already happened for that tag, and a
  # closed PR is what the `tag` job below is for.
  version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute the release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT: ${{ github.event.inputs.version }}
        run: |
          set -eo pipefail

          prev_tag=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          prev_version=${prev_tag#v}
          [ -z "$prev_version" ] && prev_version="0.0.0"

          new_version=""
          bump=""
          if [[ "$INPUT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            new_version="$INPUT"
          elif [[ "$INPUT" == "major" || "$INPUT" == "minor" || "$INPUT" == "patch" ]]; then
            bump="$INPUT"
          elif [ -n "$INPUT" ]; then
            echo "::error::version input '$INPUT' is neither X.Y.Z nor major/minor/patch" >&2
            exit 1
          else
            # Auto: the highest-precedence bump:* label on any PR merged since
            # the previous tag, defaulting to patch — including for any commit
            # that landed straight on main with no PR at all.
            if [ -n "$prev_tag" ]; then
              since=$(git log -1 --format=%aI "$prev_tag")
            else
              since="1970-01-01T00:00:00Z"
            fi
            labels=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged \
              --search "merged:>$since" --json labels --limit 200 \
              --jq '[.[].labels[].name] | join(",")')
            if echo "$labels" | grep -q "bump:major"; then bump="major"
            elif echo "$labels" | grep -q "bump:minor"; then bump="minor"
            else bump="patch"
            fi
          fi

          if [ -z "$new_version" ]; then
            IFS='.' read -r major minor patch <<< "$prev_version"
            case "$bump" in
              major) new_version="$((major + 1)).0.0" ;;
              minor) new_version="$major.$((minor + 1)).0" ;;
              patch) new_version="$major.$minor.$((patch + 1))" ;;
            esac
          fi

          echo "tag=v$new_version" >> "$GITHUB_OUTPUT"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"

      - name: Bump both package.json files and open a release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -eo pipefail
          git checkout -b "release/$TAG"
          npm pkg set version="$VERSION"
          (cd desktop && npm pkg set version="$VERSION")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json desktop/package.json
          git commit -m "chore(release): $TAG"
          git push origin "release/$TAG"
          gh pr create --repo "$GITHUB_REPOSITORY" \
            --base "${{ github.ref_name }}" --head "release/$TAG" \
            --title "chore(release): $TAG" \
            --body "Merging this cuts $TAG: the \`tag\`, \`build\`, and \`publish\` jobs run on the merge itself and publish the release."

  # On a release PR's merge — never on an ordinary PR's merge, and never on
  # the push or dispatch triggers (a tag push has nothing to tag; a dispatch
  # is what opens the PR this reacts to, not what merges it).
  tag:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged == true
      && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Tag the merge commit and push it
        id: tag
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -eo pipefail
          tag="${BRANCH#release/}"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: tag
    # always() so a skipped `tag` (the plain push:tags fallback path, where
    # `tag`'s own `if` is false) doesn't skip this by the usual propagation —
    # each branch of the `||` covers one of the two ways in.
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'push' || needs.tag.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
            arch: x64
          # darwin-arm64 is deliberately absent, and putting it back needs one
          # thing first: `desktop/scripts/binaries.json` has no Apple Silicon
          # ffmpeg pinned, because no publisher has been found that ships one
          # confirmed to carry librubberband — and an ffmpeg without it would
          # silently lose every Adjustment rather than fail. Matrixing a leg
          # that always fails would only stop the release from being cut, since
          # `publish` needs `build`. Pin one, then add it back here and to
          # `electron-builder.yml`. See ticket 05 of `.scratch/desktop-app/`.
          - os: macos-13
            platform: darwin
            arch: x64
          # Included because it comes free with the others.
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A plain tag push already checks out the right commit via
          # `github.ref`; the merged-release-PR path doesn't carry a tag ref
          # at all, so it needs the base branch (now including the merge)
          # named explicitly instead.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # The app itself, exactly as it is built for the container. The desktop
      # shell wraps this; it does not replace any of it (ADR 0009).
      - name: Build the app
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Install the desktop shell
        working-directory: desktop
        # `desktop/` is installed and run from inside its own directory —
        # there is no pnpm workspace in this repo, and the root install (the
        # one the Dockerfile runs) must never see Electron.
        run: pnpm install --frozen-lockfile

      - name: Fetch the pinned ffmpeg and ffprobe
        working-directory: desktop
        run: pnpm fetch-binaries -- --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}

      - name: Build the installer
        working-directory: desktop
        env:
          AKAPELA_TARGET_PLATFORM: ${{ matrix.platform }}
          AKAPELA_TARGET_ARCH: ${{ matrix.arch }}
          # macOS is signed and notarized. An unsigned macOS build is refused
          # outright — "Akapela is damaged and can't be opened" — not warned
          # about, and a normal user has no way past it, so this is the
          # difference between a mac build existing and not existing.
          # Windows is deliberately unsigned for now: SmartScreen warns and can
          # be clicked through, which is survivable next to a few hundred
          # dollars a year for a certificate on a first release nobody has
          # installed. Revisit if people actually hit it.
          CSC_LINK: ${{ matrix.platform == 'darwin' && secrets.MAC_CERTIFICATE_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'darwin' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm pack:app -- --${{ matrix.arch }}

      - name: Checksum the artifacts
        working-directory: desktop/release
        shell: bash
        run: |
          shopt -s nullglob
          # macOS runners have `shasum`, not `sha256sum`.
          sha256() { command -v sha256sum >/dev/null && sha256sum "$1" || shasum -a 256 "$1"; }
          for file in *.exe *.dmg *.AppImage *.zip; do
            sha256 "$file" > "$file.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: akapela-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            desktop/release/*.exe
            desktop/release/*.dmg
            desktop/release/*.AppImage
            desktop/release/*.sha256

  publish:
    needs: [tag, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          # `github.ref_name` is right for a plain tag push; the
          # merged-release-PR path has no tag ref of its own, only what
          # `tag` computed and pushed.
          tag_name: ${{ needs.tag.outputs.tag || github.ref_name }}
          files: artifacts/*
          # No auto-updater: the app checks this release and links here. The
          # notes say which platforms are signed and what a Windows user will
          # see the first time.
          generate_release_notes: true
