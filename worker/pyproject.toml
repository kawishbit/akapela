[project]
name = "akapela-worker"
version = "0.1.0"
description = "Akapela background worker: runs import, separate, and Mix jobs from the shared SQLite jobs table."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  # Vocal removal (ADR 0008). The `cpu` extra is onnxruntime, which is what
  # runs the MDX-Net model; torch comes along as a base dependency and is
  # pinned to the CPU wheel below.
  "audio-separator[cpu]>=0.47.0",
  # Named here only so `tool.uv.sources` below can reach it: uv applies a
  # source to a direct dependency, and audio-separator pulls torch in
  # transitively.
  "torch>=2.3",
  "yt-dlp[default]>=2026.8",
]

# audio-separator depends on torch unconditionally, and PyPI's default torch
# wheel for Linux bundles the CUDA runtime — gigabytes in the Worker image for
# a GPU nobody separates on (ADR 0008 explicitly rules GPU out of scope).
# PyTorch's own CPU index serves the same version without it.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[project.scripts]
akapela-worker = "akapela_worker.main:main"

[dependency-groups]
dev = [
  "opentelemetry-exporter-otlp-proto-grpc>=1.29",
  "opentelemetry-sdk>=1.29",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akapela_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
