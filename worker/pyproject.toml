[project]
name = "akapela-worker"
version = "0.1.0"
description = "Akapela background worker: runs import and Mix jobs from the shared SQLite jobs table."
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "yt-dlp[default]>=2026.8",
]

[project.scripts]
akapela-worker = "akapela_worker.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["akapela_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
