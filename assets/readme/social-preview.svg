<svg xmlns="http://www.w3.org/2000/svg"
     width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-labelledby="sp-title sp-desc">
  <title id="sp-title">Akapela</title>
  <desc id="sp-desc">GitHub social preview, adapted from hero.svg: self-hosted karaoke with synced Lyrics.</desc>

  <defs>
