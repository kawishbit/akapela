    <text x="772" y="126" font-size="13" font-weight="600" fill="#8f8f8f">Nova &#183; +2 semitones &#183; 96% tempo</text>

    <text x="704" y="178" font-size="20" font-weight="800" fill="rgba(255,255,255,0.28)">there&#8217;s a road no map can find</text>
