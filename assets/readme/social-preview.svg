      <stop offset="0%" stop-color="#1ed760" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1ed760" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="emblemClip">
      <rect x="0" y="0" width="84" height="84" rx="20"/>
    </clipPath>
  </defs>

  <!-- Full bleed: GitHub crops and rounds the corners itself -->
  <rect width="1280" height="640" fill="#121212"/>
  <circle cx="150" cy="250" r="300" fill="url(#glow)"/>

