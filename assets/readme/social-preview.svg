      <text x="164" y="186" font-size="68" font-weight="800" fill="#ffffff">kapela</text>
      <text x="64" y="250" font-size="25" font-weight="600" fill="#d9d9d9">Import a song, sing to synced Lyrics,</text>
      <text x="64" y="284" font-size="25" font-weight="600" fill="#d9d9d9">and mix down your Take.</text>
      <text x="64" y="340" font-size="15" font-weight="600" fill="#8f8f8f">Desktop App or Docker Compose &#183; everything stays on your machine</text>
