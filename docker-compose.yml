# Akapela: self-hosted karaoke.
#
#   docker compose up -d
#
# One service. `app` serves the UI and API and runs every background Job —
# import, render, vocal removal — itself; there used to be a second `worker`
# service here, but every Job now runs in process, with vocal removal's ONNX
# inference isolated into its own subprocess rather than a separate
# container (ADR 0002 superseded).
#
# Data lives in the named volume `akapela-data` by default. To use a host
# directory instead, set AKAPELA_DATA=./some/dir in .env (see .env.example).
# Backups are your job: copy that directory while the stack is stopped.

services:
  app:
    build: .
    ports:
      - "${AKAPELA_PORT:-3000}:3000"
    environment:
      NUXT_DATA_DIR: /data
      # Optional. With a token, Genius joins LRCLIB and Manual as a Lyrics
      # Provider; without one it is hidden and the others carry on.
      AKAPELA_GENIUS_TOKEN: "${AKAPELA_GENIUS_TOKEN:-}"
    volumes:
      - ${AKAPELA_DATA:-akapela-data}:/data
    restart: unless-stopped
    # Recommended limits; adjust to taste. Vocal removal is the heaviest
    # Job — several cores and a few GB of memory make it worth having —
    # everything else this service does is light by comparison.
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

volumes:
  akapela-data:
